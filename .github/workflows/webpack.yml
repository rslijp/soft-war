name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Jasmine test and eslint - shared
      run: |
        cd shared
        npm install
        npm run test
        npm run eslint

    - name: Eslint - front end
      run: |
        cd frontend
        npm install
        npm run eslint
        npm run build

    - name: Eslint - backend
      run: |
        cd backend
        npm install
        npm run eslint
